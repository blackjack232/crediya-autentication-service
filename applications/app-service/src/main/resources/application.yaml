server:
  port: 8090
spring:
  application:
    name: "CrediYaAutenticationService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"

  springdoc:
    swagger-ui:
      path: /docs              # UI en /docs
    api-docs:
      path: /api-docs          # JSON en /api-docs (y YAML en /api-docs.yaml)
  r2dbc:
    host: localhost
    port: 5432
    username: authentication_user
    password: mypassword
    database: authentication_db
    schema: auth
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"


