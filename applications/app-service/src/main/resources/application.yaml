server:
  port: 8080
spring:
  application:
    name: "CrediYaAutenticationService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  r2dbc:
    host: localhost
    port: 5432
    username: postgres
    password: admin
    database: crediya_db
  springdoc:
    swagger-ui:
      path: /docs              # UI en /docs
    api-docs:
      path: /api-docs          # JSON en /api-docs (y YAML en /api-docs.yaml)

  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
